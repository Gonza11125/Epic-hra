<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS | Dopravní ateliér</title><style>
*{box-sizing:border-box}body{margin:0;background:#091426;color:#e3f5fa;font:15px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:0;left:0;right:0;padding:18px;pointer-events:none;background:linear-gradient(#081424dd,transparent)}h1{font-size:22px;margin:4px 0}p{margin:6px 0;color:#bfd5e6}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;pointer-events:auto}button,a{font:inherit;border:1px solid #89b6c95e;background:#172e4b;color:#e6f8fa;border-radius:6px;padding:9px 13px;text-decoration:none}button.active{background:#0b858e}footer{position:absolute;bottom:0;left:0;right:0;padding:12px 18px;background:#091426b0;pointer-events:none;font-size:12px}#error{color:#ffbb88}</style></head><body><header><small>NEXUS / DESIGN LAB / 5000</small><h1 id="title">M1 — LUMEN R24</h1><p id="details"></p><nav><button id="m1" class="active">M1 Maglev</button><button id="a2">A2 Cityliner</button><button id="door">Otevřít dveře</button><button id="interior">Interiér vlaku</button><button id="reset">Obnovit pohled</button><a href="./?v=01364">Zpět do hry</a></nav><p id="error"></p></header><footer>Tažením otáčej model • kolečkem nebo dvěma prsty přibližuj • stejné modely jako ve hře</footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createTransitVehicles,DIMENSIONS,buildGuideway} from './transitVehicles.js?v=01364';
import {createLumenAudio} from './lumenAudio.js?v=01364';
try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x17253d);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,350);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=100;controls.maxPolarAngle=Math.PI*.49;scene.add(new T.HemisphereLight(0xc6e9ff,0x8a7d9e,2.3));for(const [x,y,z,c,p] of [[12,24,15,0xffe7ce,3],[-18,9,-14,0x7bbfff,2],[4,15,-23,0xc9adff,2]]){const l=new T.DirectionalLight(c,p);l.position.set(x,y,z);scene.add(l)}
const ground=new T.Mesh(new T.PlaneGeometry(160,160),new T.MeshStandardMaterial({color:0x293b56,roughness:.78}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);const grid=new T.GridHelper(120,60,0x51698a,0x34445d);grid.position.y=.003;scene.add(grid);const A=createTransitVehicles(T),models={M1:A.train(),A2:A.shuttle()};const guide=buildGuideway(T,scene,0,46);for(const m of Object.values(models)){m.group.position.y=.58;scene.add(m.group)}let id='M1',open=false;let actx=null;const sfx=createLumenAudio(()=>actx&&actx.state==='running'?actx:null);function audio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}actx?.resume();sfx.unlock()}catch(e){}}
let door={phase:'closed',p:0,t:0};function cycle(dt){const d=door;d.t+=dt;if(d.phase==='released'&&d.t>.15){d.phase='opening';d.t=0}if(d.phase==='opening'){d.p=Math.min(1,d.t/.75);if(d.p>=1)d.phase='open'}if(d.phase==='warning'&&d.t>1.1){d.phase='closing';d.t=0;sfx.doorSlide(1,true)}if(d.phase==='closing'){d.p=Math.max(0,1-d.t/.75);if(d.p<=0){d.phase='closed';sfx.doorLocked(1)}}}
function reset(){controls.minDistance=4;const d=DIMENSIONS[id].length;const dist=Math.max(d*.88,d*.92/camera.aspect);controls.target.set(0,1.7,0);camera.position.set(dist*.92,dist*.48,dist*.68);controls.update()}
function show(k){id=k;open=false;for(const [name,m] of Object.entries(models)){m.group.visible=name===k;m.setDoors(false);door={phase:'closed',p:0,t:0}}guide.visible=k==='M1';document.getElementById('m1').classList.toggle('active',k==='M1');document.getElementById('a2').classList.toggle('active',k==='A2');document.getElementById('door').textContent='Otevřít dveře';document.getElementById('title').textContent=k==='M1'?'M1 — LUMEN R24':'A2 — SOLARIS CITYLINER';const d=DIMENSIONS[k];document.getElementById('details').textContent='Délka '+d.length+' m · '+(d.cars?d.cars+' články · magnetická levitace':'antigravitační městská doprava');reset()}
document.getElementById('m1').onclick=()=>show('M1');document.getElementById('a2').onclick=()=>show('A2');document.getElementById('door').onclick=()=>{audio();open=!open;if(id==='M1'){if(open){door={phase:'released',p:door.p,t:0};sfx.doorRelease(1);sfx.doorSlide(.8)}else{door={phase:'warning',p:door.p,t:0};sfx.doorWarning(1)}}else models[id].setDoors(open);document.getElementById('door').textContent=open?'Zavřít dveře':'Otevřít dveře'};document.getElementById('interior').onclick=()=>{if(id!=='M1')show('M1');controls.minDistance=.08;camera.position.set(0,2.25,8.8);controls.target.set(0,2.25,0);controls.update()};document.getElementById('reset').onclick=reset;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});show('M1');let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(id==='M1'){cycle(dt);models.M1.setDoorProgress(door.p,0,door.phase);models.M1.animate(dt,{speed:0,daylight:1})}controls.update();renderer.render(scene,camera)});
}catch(e){document.getElementById('error').textContent='3D prohlížeč se nepodařilo spustit: '+e.message}
</script></body></html>
