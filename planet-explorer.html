</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><div id="top"><header class="panel"><small>NEXUS / ELYRA / 0.1.4.2</small><strong>Průzkum povrchu</strong></header><select id="location" aria-label="Místo"></select><select id="quality" aria-label="Kvalita"><option value="mobile">Mobilní</option><option value="high">Vysoká</option></select><button id="mode">Přistát</button><button id="auto">Let: vyp.</button><button id="grid">Síť: vyp.</button><button id="atlas">Atlas</button><button id="game">Hra</button></div><div id="hud" class="panel"><div id="position">Načítám planetu…</div><div id="stats"></div><div id="message">W/S nebo šipky: let · A/D: směr</div></div><div id="cross">+</div><div id="control"><div id="dpad"><span></span><button data-key="forward">▲</button><span></span><button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button><button data-key="run" id="runBtn" hidden style="font-size:12px">Běh</button><button id="jumpBtn" hidden style="font-size:12px">Skok</button></div><div id="sliders" class="panel"><label id="altLabel">Výška nad povrchem <b id="altText"></b></label><input id="alt" aria-label="Výška" type="range" min="0" max="1000" value="620"><label id="speedLabel">Rychlost <b id="speedText"></b></label><input id="speed" aria-label="Rychlost" type="range" min="0" max="1000" value="520"><label>Sklon pohledu <b id="pitchText"></b></label><input id="pitch" aria-label="Sklon pohledu" type="range" min="-60" max="85" value="30"></div></div><script type="module">
import * as T from 'three';
import {PLANET,BIOMES,CIVILIZATIONS,LOCATIONS,direction,coordinates,normalize,sample,greatCircleStep,distanceKm} from './elyra-geography.js?v=1';

const $=id=>document.getElementById(id),fmt=(n,d=1)=>n.toLocaleString('cs-CZ',{maximumFractionDigits:d});
try{
const R=PLANET.radiusKm,renderer=new T.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x9dbbd2);const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.003,5200);const sun=new T.DirectionalLight(0xffe5c0,2.4);scene.add(sun,sun.target,new T.HemisphereLight(0xcce4ff,0x6e7e80,1.35));const root=new T.Group();scene.add(root);
const colors=Object.fromEntries(BIOMES.map(b=>[b.id,new T.Color(b.color)])),material=new T.MeshStandardMaterial({vertexColors:true,roughness:.96,side:T.DoubleSide});let wire=false;
let resolution=12,settings={budget:105,maxLevel:13,threshold:.8};
function build(t){const raw=buildSurfaceTile(t,resolution),positions=Float32Array.from(raw.positions,x=>x/1000),normals=Float32Array.from(raw.normals),c=new Float32Array(raw.biomes.length*3);for(let i=0;i<raw.biomes.length;i++){const a=colors[raw.biomes[i]];c.set([a.r,a.g,a.b],i*3)}const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(positions,3));g.setAttribute('normal',new T.BufferAttribute(normals,3));g.setAttribute('color',new T.BufferAttribute(c,3));g.setIndex(raw.indices);g.computeBoundingSphere();const mesh=new T.Mesh(g,material);mesh.visible=false;root.add(mesh);return {mesh,origin:raw.originMeters.map(x=>x/1000),level:t.level,tile:t}}
const stream=new TileStream({build,dispose:v=>{root.remove(v.mesh);v.mesh.geometry.dispose()},maxCache:240});
let loc=LOCATIONS[0],position=direction(loc.lat,loc.lon),tangent=normalize([-position[2],0,position[0]]),auto=false,lastRequest=-Infinity,lastPos=position,lastAlt=0,travelled=0,forceRequest=true;
const params=new URLSearchParams(location.search);if(params.has('lat')&&params.has('lon')){const lat=Number(params.get('lat')),lon=Number(params.get('lon'));if(Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90){position=direction(lat,lon);tangent=normalize([-Math.sin(lon*Math.PI/180),0,Math.cos(lon*Math.PI/180)]);lastPos=position;loc=null}}

function land(){if(sample(position).elevationKm<=0){message('Nelze přistát na oceánu. Vyber pevninu.');return}auto=false;$('auto').textContent='Let: vyp.';walker=createWalker(position,tangent);landing=true;forceRequest=true;$('mode').textContent='Vzlétnout';$('auto').disabled=true;$('alt').disabled=true;$('speed').disabled=true;$('runBtn').hidden=false;$('jumpBtn').hidden=false;$('pitch').value=6;message('Připravuji detailní terén pro přistání.');}

$('mode').onclick=()=>walker?fly():land();$('jumpBtn').onclick=()=>{jumpQueued=true};
const keys=new Set(),keymap={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',Shift:'run',q:'strafeLeft',e:'strafeRight'};
function release(){keys.clear()}addEventListener('keydown',e=>{if(e.code==='Space'&&walker&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();if(!e.repeat)jumpQueued=true;return}const k=keymap[e.key]||keymap[e.key.toLowerCase()];if(k&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>{const k=keymap[e.key]||keymap[e.key.toLowerCase()];if(k)keys.delete(k)});addEventListener('blur',release);
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k))}

function turn(angle){const a=new T.Vector3(...position),b=new T.Vector3(...tangent).applyAxisAngle(a,angle);tangent=normalize(b.toArray())}
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;turn(-(e.clientX-drag.x)*.004);$('pitch').value=Math.max(-60,Math.min(85,Number($('pitch').value)+(e.clientY-drag.y)*.14));drag.x=e.clientX;drag.y=e.clientY});for(const ev of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(ev,()=>drag=null);
if(!loc){const o=document.createElement('option');o.value='';o.textContent='Vlastní souřadnice';$('location').append(o)}for(const l of LOCATIONS){const o=document.createElement('option');o.value=l.id;o.textContent=l.name;$('location').append(o)}
$('location').onchange=()=>{loc=LOCATIONS.find(l=>l.id===$('location').value);if(!loc)return;if(walker)fly();position=direction(loc.lat,loc.lon);tangent=normalize([-position[2],0,position[0]]);travelled=0;forceRequest=true};
$('quality').onchange=()=>{settings=$('quality').value==='high'?{budget:165,maxLevel:14,threshold:.62}:{budget:105,maxLevel:13,threshold:.8};stream.maxCache=$('quality').value==='high'?360:240;forceRequest=true};
$('auto').onclick=()=>{auto=!auto;$('auto').textContent='Let: '+(auto?'zap.':'vyp.')};$('grid').onclick=()=>{wire=!wire;material.wireframe=wire;$('grid').textContent='Síť: '+(wire?'zap.':'vyp.')};$('atlas').onclick=()=>location.href='./planet-atlas.html?v=3';$('game').onclick=()=>location.href='./?v=0142';
$('alt').oninput=()=>{forceRequest=true};
const roots=Array.from({length:6},(_,face)=>({face,level:0,x:0,y:0}));stream.request(roots);stream.tick(6);
let prev=performance.now(),lastHud=0;
function frame(now){const dt=Math.min(.08,Math.max(0,(now-prev)/1000));prev=now;const h=walker ? .00168 : altitude(),s=speed();
 const angle=(Number(keys.has('left'))-Number(keys.has('right')))*dt*1.35;if(angle)turn(angle);
 if(walker){walker.tangent=tangent;if(!landing){stepWalker(walker,{dt,move:Number(keys.has('forward'))-Number(keys.has('back')),strafe:Number(keys.has('strafeRight'))-Number(keys.has('strafeLeft')),run:keys.has('run'),jump:jumpQueued,groundRadius,canMove:p=>sample(p).elevationKm>0&&(findTile(p,activeTiles)?.tile.level??0)>=13});position=walker.position;tangent=walker.tangent}jumpQueued=false}
 else{const velocity=(Number(auto||keys.has('forward'))-Number(keys.has('back')))*s;if(velocity){const q=greatCircleStep(position,tangent,velocity*dt);position=q.position;tangent=q.tangent;travelled+=Math.abs(velocity*dt)}}
 const moved=distanceKm(lastPos,position),trigger=walker ? .006 : Math.max(.15,h*.15);
 if(now-lastRequest>300&&(!stream.pending||forceRequest||(!walker&&moved>Math.max(h*2,30)))&&(forceRequest||moved>trigger||Math.abs(Math.log(h/Math.max(.000001,lastAlt)))>.18)){
 const opts=walker?{budget:$('quality').value==='high'?225:165,maxLevel:18,threshold:.65}:settings;
 stream.request(selectTiles(position,h,opts));lastRequest=now;lastPos=position.slice();lastAlt=h;forceRequest=false}

 if(stream.active!==lastActive){activeTiles=[...stream.active].map(k=>stream.cache.get(k).tile);lastActive=stream.active}
 if(landing&&!forceRequest&&walkReady()){landing=false;message('Přistání dokončeno. Šipky / W S, běh Shift, skok mezerník.')}
 if(landing&&!forceRequest&&!stream.pending&&!walkReady()){fly();message('Terén nemá dostatečnou podrobnost pro přistání.')}
 const ground=sample(position),surface=walker&&!landing?groundRadius(position)/1000:R+Math.max(0,ground.elevationKm),height=walker&&!landing?(WALK.eyeMeters+walker.offsetMeters)/1000:walker ? .15 : h,origin=position.map(x=>x*(surface+height));

 sun.position.copy(up).multiplyScalar(100).add(new T.Vector3(65,50,45));sun.target.position.set(0,0,0);

 if(now-lastHud>150){lastHud=now;const c=coordinates(position),bio=BIOMES.find(b=>b.id===ground.biome),civ=CIVILIZATIONS.find(b=>b.id===ground.civilization);$('position').textContent=fmt(c.lat,5)+'° / '+fmt(c.lon,5)+'° · '+bio.name+' · '+(civ?.name||'Divoká oblast');$('stats').textContent='Sektory '+stream.active.size+' · LOD '+Math.max(0,...activeTiles.map(t=>t.level))+' · načítání '+stream.pending+(walker?' · pěšky '+fmt(walker.travelledMeters,1)+' m · g '+fmt(Math.hypot(...gravityVector(position,ground.elevationKm*1000)),2)+' m/s²':' · proletěno '+fmt(travelled,2)+' km');$('altText').textContent=walker?fmt(WALK.eyeMeters+walker.offsetMeters,2)+' m':fmt(h,2)+' km';$('speedText').textContent=walker?fmt(keys.has('run')?WALK.runMps:WALK.walkMps,1)+' m/s':fmt(s,2)+' km/s';$('pitchText').textContent=$('pitch').value+'°';$('message').textContent=now<noticeUntil?notice:landing?'Připravuji místo přistání…':walker?(walker.grounded?'Na povrchu · W/S, Q/E úkroky, Shift, mezerník':'Ve vzduchu · radiální gravitace'):stream.pending?'Připravuji nové sektory, staré zůstávají zobrazené.':'W/S nebo šipky · tahem měň směr pohledu'}}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(frame);
}catch(e){console.error(e);$('position').textContent='Průzkum nelze spustit: '+e.message}
</script></body></html>
