<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ELYRA — Planetary atlas</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111d;color:#ecf4f6;font:14px system-ui}canvas{display:block;touch-action:none}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;pointer-events:none}#top>*{pointer-events:auto}.panel{background:#101f2eea;border:1px solid #365060;border-radius:10px;padding:10px 13px}header small{display:block;color:#90b4c5;letter-spacing:2px;font-size:10px}header strong{font-size:19px}button,select{font:inherit;color:#edf8f7;background:#1c3445;border:1px solid #476576;border-radius:8px;min-height:40px;padding:9px}button:active{background:#426477}#info{position:absolute;left:12px;bottom:max(12px,env(safe-area-inset-bottom));width:min(330px,calc(100% - 24px));pointer-events:none}#legend{position:absolute;right:12px;top:115px;max-height:55vh;overflow:auto;max-width:190px;font-size:12px}#legend div{display:flex;gap:7px;align-items:center;margin:5px 0}.sw{width:11px;height:11px;border-radius:3px;flex:none}#detail{font-size:12px;line-height:1.5;color:#bfd5de}#status{font-size:11px;color:#9bb3c2}#probe{font-weight:600;margin:4px 0}#legendToggle{display:none}@media(max-width:650px){header{width:100%}#top{gap:5px}button,select{font-size:12px;padding:7px}#legend{top:160px;max-height:40vh;display:none}#legend.open{display:block}#legendToggle{display:block}#info{width:min(280px,calc(100% - 24px))}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="top"><header class="panel"><small>NEXUS / PLANETARY ATLAS</small><strong>ELYRA</strong> · 1 737,4 km</header><select id="layer" aria-label="Zobrazení"><option value="biome">Biomy</option><option value="civilization">Civilizace</option><option value="elevation">Výšková mapa</option></select><select id="location" aria-label="Místa"><option value="">Vyber místo</option></select><button id="orbit">Otáčení: zap.</button><button id="relief">Reliéf: skutečný</button><button id="tour">Oběh sondy</button><button id="export">Export JSON</button><button id="legendToggle">Legenda</button><button id="explore">Průzkum povrchu</button><button id="game">Hra</button></div><div id="legend" class="panel"></div><div id="info" class="panel"><div id="probe">Vyber bod na planetě</div><div id="detail">Otáčej prstem, přibližuj dvěma prsty.</div><div id="status">Načítání…</div></div><script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PLANET,BIOMES,CIVILIZATIONS,LOCATIONS,normalize,direction,coordinates,sample,distanceKm,greatCircleStep,geographyManifest} from './elyra-geography.js?v=1';
const $=id=>document.getElementById(id),fmt=(n,d=1)=>n.toLocaleString('cs-CZ',{maximumFractionDigits:d});
try{
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x050d18);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.02,200);camera.position.set(4.1,2.2,5.7);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=2.38;controls.maxDistance=14;controls.autoRotate=true;controls.autoRotateSpeed=.45;
const sun=new T.DirectionalLight(0xffedcf,2.25);sun.position.set(4,3,6);scene.add(sun,new T.HemisphereLight(0xb4d7ff,0x6a7c86,1.1));const world=new T.Group();scene.add(world);
const R=2,geom=new T.SphereGeometry(R,192,96),p=geom.attributes.position,dirs=[],samples=[],colors=new Float32Array(p.count*3);for(let i=0;i<p.count;i++){const v=normalize([p.getX(i),p.getY(i),p.getZ(i)]);dirs.push(v);samples.push(sample(v))}
geom.setAttribute('color',new T.BufferAttribute(colors,3));const globe=new T.Mesh(geom,new T.MeshStandardMaterial({vertexColors:true,roughness:.91,metalness:0}));world.add(globe);
let exaggeration=1,selected=null,touring=false,travelled=0,tourStart=null,tourTangent=null;
const atmosphere=new T.Mesh(new T.SphereGeometry(R*1.018,96,48),new T.ShaderMaterial({transparent:true,depthWrite:false,side:T.FrontSide,blending:T.AdditiveBlending,vertexShader:'varying vec3 n;varying vec3 v;void main(){vec4 q=modelViewMatrix*vec4(position,1.);n=normalize(normalMatrix*normal);v=normalize(-q.xyz);gl_Position=projectionMatrix*q;}',fragmentShader:'varying vec3 n;varying vec3 v;void main(){float rim=pow(1.-max(0.,dot(normalize(n),normalize(v))),3.5);gl_FragColor=vec4(.23,.55,.92,rim*.45);}'}));world.add(atmosphere);
const biomeColors=Object.fromEntries(BIOMES.map(b=>[b.id,new T.Color(b.color)])),civColors=Object.fromEntries(CIVILIZATIONS.map(b=>[b.id,new T.Color(b.color)]));const color=new T.Color(),low=new T.Color(0x65806f),high=new T.Color(0xe7e5e5),water=new T.Color(0x254f7f);
const radius=s=>R*(1+s.elevationKm/PLANET.radiusKm*exaggeration);
function repaint(){const layer=$('layer').value;for(let i=0;i<p.count;i++){const s=samples[i],v=dirs[i],r=radius(s);p.setXYZ(i,v[0]*r,v[1]*r,v[2]*r);if(layer==='civilization'){color.copy(s.elevationKm<=0?water:civColors[s.civilization]||new T.Color(0x687e78));}else if(layer==='elevation'){color.copy(s.elevationKm<=0?water:low).lerp(high,s.elevationKm>0?Math.min(1,s.elevationKm/6):0)}else color.copy(biomeColors[s.biome]);colors.set([color.r,color.g,color.b],i*3)}p.needsUpdate=true;geom.attributes.color.needsUpdate=true;geom.computeVertexNormals();geom.computeBoundingSphere();for(const marker of markers)placeMarker(marker);if(selected)moveProbe(selected);updateLegend()}
const markers=[];for(const loc of LOCATIONS){const o=new T.Mesh(new T.SphereGeometry(.027,12,8),new T.MeshBasicMaterial({color:loc.id==='frontier'?0xffdf8b:0xe0f5ff}));world.add(o);markers.push({loc,o,v:direction(loc.lat,loc.lon)});const opt=document.createElement('option');opt.value=loc.id;opt.textContent=loc.name;$('location').append(opt)}
function placeMarker(m){const r=radius(sample(m.v))+.019;m.o.position.set(...m.v.map(x=>x*r))}
const probe=new T.Mesh(new T.SphereGeometry(.031,16,10),new T.MeshBasicMaterial({color:0xffcd72}));probe.visible=false;world.add(probe);
function moveProbe(v){selected=normalize(v);const s=sample(selected);probe.position.set(...selected.map(x=>x*(radius(s)+.025)));probe.visible=true;return s}
function inspect(v,label='Zvolený bod'){const s=moveProbe(v),c=coordinates(v),bio=BIOMES.find(b=>b.id===s.biome),civ=CIVILIZATIONS.find(b=>b.id===s.civilization);$('probe').textContent=label;$('detail').textContent=fmt(c.lat,2)+'° šířka · '+fmt(c.lon,2)+'° délka · '+bio.name+' · '+(s.elevationKm>=0?'+':'')+fmt(s.elevationKm,2)+' km · '+fmt(s.temperatureC)+' °C · '+(civ?.name||(s.elevationKm<=0?'Oceán':'Neosídlená oblast'));}
function focus(v){controls.autoRotate=false;$('orbit').textContent='Otáčení: vyp.';camera.position.set(...v.map(x=>x*4.4));controls.update()}
function updateLegend(){const list=$('layer').value==='biome'?BIOMES:$('layer').value==='civilization'?[...CIVILIZATIONS,{name:'Neosídlená oblast',color:'#687e78'},{name:'Oceán',color:'#254f7f'}]:[{name:'Oceány',color:'#254f7f'},{name:'Nížiny',color:'#65806f'},{name:'Hory',color:'#e7e5e5'}];$('legend').replaceChildren();for(const b of list){const row=document.createElement('div'),sw=document.createElement('span');sw.className='sw';sw.style.background=b.color;row.append(sw,document.createTextNode(b.name));$('legend').append(row)}}
$('layer').onchange=repaint;$('location').onchange=()=>{const loc=LOCATIONS.find(l=>l.id===$('location').value);if(loc){touring=false;const v=direction(loc.lat,loc.lon);inspect(v,loc.name);focus(v)}};
$('orbit').onclick=()=>{controls.autoRotate=!controls.autoRotate;$('orbit').textContent='Otáčení: '+(controls.autoRotate?'zap.':'vyp.')};
$('relief').onclick=()=>{exaggeration=exaggeration===1?15:1;$('relief').textContent='Reliéf: '+(exaggeration===1?'skutečný':'15× zvýrazněný');repaint()};
$('legendToggle').onclick=()=>$('legend').classList.toggle('open');$('explore').onclick=()=>{const c=selected?coordinates(selected):null;location.href='./planet-explorer.html?v=0141'+(c?'&lat='+encodeURIComponent(c.lat)+'&lon='+encodeURIComponent(c.lon):'')};$('game').onclick=()=>location.href='./?v=0141';
const ray=new T.Raycaster(),mouse=new T.Vector2();let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,id:e.pointerId}});renderer.domElement.addEventListener('pointerup',e=>{if(!down||down.id!==e.pointerId||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObject(globe)[0];if(hit){touring=false;inspect(hit.point.toArray())}down=null});
const circumference=2*Math.PI*PLANET.radiusKm;$('tour').onclick=()=>{if(touring){touring=false;return}tourStart=selected||direction(0,0);tourTangent=normalize(Math.abs(tourStart[1])<.95?[-tourStart[2],0,tourStart[0]]:[0,-tourStart[2],tourStart[1]]);travelled=0;touring=true;focus(tourStart)};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(geographyManifest(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ELYRA-planet-v1.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});repaint();$('status').textContent='Obvod '+fmt(circumference,0)+' km • 12 biomů • 4 civilizační oblasti';let prev=performance.now(),lastInspect=0;
renderer.setAnimationLoop(now=>{const dt=Math.min(.08,(now-prev)/1000);prev=now;if(touring){travelled=Math.min(circumference,travelled+dt*circumference/36);const q=greatCircleStep(tourStart,tourTangent,travelled);moveProbe(q.position);camera.position.set(...q.position.map(x=>x*4.4));if(now-lastInspect>120||travelled>=circumference){lastInspect=now;inspect(q.position,'Sonda · '+fmt(travelled,0)+' / '+fmt(circumference,0)+' km')}if(travelled>=circumference){touring=false;$('status').textContent='Oběh dokončen • odchylka '+fmt(distanceKm(tourStart,q.position)*1000,3)+' m'}}controls.update();renderer.render(scene,camera)});
}catch(e){console.error(e);$('status').textContent='Atlas nelze spustit: '+e.message}
</script></body></html>
