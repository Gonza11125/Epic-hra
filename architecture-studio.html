import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

try{
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xa1b6bf);scene.fog=new T.FogExp2(0xa1b6bf,.012);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.05,180),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=.3;controls.maxDistance=55;controls.maxPolarAngle=Math.PI/2+.03;
const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();const env=pmrem.fromScene(room,.04);scene.environment=env.texture;room.dispose();pmrem.dispose();
const sun=new T.DirectionalLight(0xffecd1,3);sun.position.set(-9,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-13,right:13,top:13,bottom:-13,near:.5,far:45});sun.shadow.normalBias=.035;sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);const hemi=new T.HemisphereLight(0xcce5ff,0x556e67,1.0);scene.add(hemi);
const mat=(c,r=.6,m=.1)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={stone:mat(0x9caab0,.82),wood:mat(0xb0967e,.65),fabric:mat(0x5d8988,.95),cream:mat(0xe7e0d2,.93),metal:mat(0x485f6c,.37,.55),plant:mat(0x9887b8,.72),leaf:mat(0x739e99,.75),ground:mat(0x667e79,.95)};

const shared=architectureMaterials(T);let asset=null,shadow=false,interior=false,current='arc';
function mesh(parent,g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=!m.transparent;o.receiveShadow=!m.transparent;parent.add(o);return o}
function box(parent,m,x,y,z,w,h,d,r=.08){return mesh(parent,new RoundedBoxGeometry(w,h,d,2,Math.min(r,w/2,h/2,d/2)),m,x,y,z)}
function plant(parent,x,z,scale=1){mesh(parent,new T.CylinderGeometry(.43*scale,.33*scale,.52*scale,24),M.metal,x,.26*scale,z);for(let i=0;i<7;i++){const a=i*2.4;const leaf=mesh(parent,new T.SphereGeometry(.3*scale,12,8),i%2?M.plant:M.leaf,x+Math.sin(a)*.23*scale,(.78+i*.08)*scale,z+Math.cos(a)*.23*scale);leaf.scale.set(.5,1.75,.75);leaf.rotation.z=Math.sin(a)*.6}}
function rebuild(){current=$('model').value;if(asset){scene.remove(asset);asset.traverse(o=>{if(o.isMesh)o.geometry.dispose()})}asset=new T.Group();asset.name='ELYRA_'+current.toUpperCase();scene.add(asset);
const w=current==='arc'?10:11,d=current==='tier'?9:8;createOrganicEnvelope(T,asset,{w,d,type:current,wallTop:2.9,doorWidth:2.4,rise:current==='tier'?2.65:2.25});
box(asset,shared.pearl,0,.035,0,w+.7,.07,d+.5,.03);box(asset,M.wood,0,.085,0,w-.35,.05,d-.3,.02);box(asset,M.stone,0,.035,d/2+1.4,w+1,.07,2.8,.035);

const bx=-w/2+1.35,bz=-d/2+1.6;box(asset,shared.pearl,bx,.3,bz,1.9,.5,2.5,.18);box(asset,M.cream,bx,.62,bz,1.83,.20,2.43,.1);box(asset,M.fabric,bx,.76,bz+.3,1.82,.12,1.62,.06);for(const x of [-.45,.45])box(asset,M.cream,bx+x,.79,bz-.82,.76,.15,.45,.07);
const sx=w/2-1.1;box(asset,shared.pearl,sx,.29,1.05,1.65,.48,2.6,.18);for(const z of [.43,1.65]){box(asset,M.fabric,sx,.60,z,1.50,.22,1.15,.12);box(asset,M.fabric,sx+.64,.95,z,.28,.65,1.15,.12)}box(asset,M.wood,sx-1.4,.48,1.05,.65,.08,1.2,.04);box(asset,shared.pearl,sx-1.4,.24,1.05,.46,.44,.8,.10);
const kx=w/2-.7;box(asset,shared.pearl,kx,.49,-d/2+1.4,1.05,.98,2.55,.10);box(asset,M.wood,kx,1.015,-d/2+1.4,1.08,.07,2.58,.03);box(asset,shared.solar,kx,1.065,-d/2+.85,.68,.028,.7,.012);box(asset,shared.light,kx-.54,.74,-d/2+1.4,.025,.04,2.3,.01);
box(asset,M.metal,0,1.6,-d/2+.15,2.45,1.3,.09,.04);box(asset,shared.solar,0,1.6,-d/2+.21,2.28,1.14,.035,.02);
for(const x of [-w*.27,w*.27])box(asset,shared.light,x,2.78,0,.065,.045,d*.70,.02);
plant(asset,-w/2+.75,1.9,.7);plant(asset,w/2-.7,-.5,.65);
asset.updateMatrixWorld(true);outside();$('status').textContent='Táhni pro otáčení • dvěma prsty přibližuj • GLB = model bez ateliérového osvětlení';
}
function outside(){interior=false;camera.position.set(12,7.6,13.8);controls.target.set(0,1.9,0);controls.minDistance=3;controls.maxPolarAngle=Math.PI/2+.03;controls.update()}
function inside(){interior=true;camera.position.set(0,1.68,2.9);controls.target.set(0,1.7,-1.8);controls.minDistance=.15;controls.maxPolarAngle=Math.PI*.93;controls.update()}
function lighting(){const val=$('lighting').value;if(val==='day'){scene.background.set(0xa1b6bf);sun.color.set(0xffecd1);sun.intensity=3;sun.position.set(-9,14,8);hemi.intensity=1;renderer.toneMappingExposure=1.1}else if(val==='gold'){scene.background.set(0xc69c91);sun.color.set(0xffaa60);sun.intensity=3.7;sun.position.set(-12,4,8);hemi.intensity=.7;renderer.toneMappingExposure=1.07}else{scene.background.set(0x121f36);sun.color.set(0x9dc0ff);sun.intensity=.35;sun.position.set(-9,10,8);hemi.intensity=.25;renderer.toneMappingExposure=.85}scene.fog.color.copy(scene.background);scene.environmentIntensity=val==='night'?.25:1;}
$('model').onchange=rebuild;$('lighting').onchange=lighting;$('inside').onclick=inside;$('outside').onclick=outside;$('quality').onclick=()=>{shadow=!shadow;renderer.shadowMap.enabled=shadow;renderer.setPixelRatio(Math.min(devicePixelRatio,shadow?1.6:1.4));scene.traverse(o=>{if(o.isMesh)o.material.needsUpdate=true});$('quality').textContent='Stíny: '+(shadow?'zap.':'vyp.')};$('game').onclick=()=>location.href='./?v=01368';
$('export').onclick=async()=>{const btn=$('export');btn.disabled=true;try{asset.updateMatrixWorld(true);const data=await new GLTFExporter().parseAsync(asset,{binary:true,onlyVisible:true});const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='NEXUS-ELYRA-'+current+'.glb';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('status').textContent='Export vytvořen. V Safari zkontroluj stažené soubory.'}catch(e){$('status').textContent='Export selhal: '+e.message}finally{btn.disabled=false}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});rebuild();lighting();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
}catch(e){console.error(e);$('status').textContent='Ateliér nelze spustit: '+e.message}
</script></body></html>
